name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job, and it installs nothing but pytest. Every number in the README
  # (the five-regime boundary, the per-rule error directions, the by-tier
  # decidability, the amendment table) comes from code that imports only the
  # standard library. The paid leg in scripts/real_run.py is the only thing
  # needing a vendor SDK and it is never run in CI: it costs money and needs a
  # key. If the measurement ever acquires a dependency this job goes red, which
  # is the signal that a claim in the README has stopped being true.
  measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pytest only
        run: |
          python -m pip install --upgrade pip
          pip install "pytest>=8,<10"

      # -rs prints skip reasons. There should be none; any that appear mean a
      # test meant to run everywhere has quietly acquired a dependency.
      - name: Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q -rs

      # The whole free measurement at a smaller corpus so CI stays quick. This
      # checks the code that produces the published figures still runs; it does
      # not check the figures match at n=150, which they do not have to.
      - name: Offline measurement
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/offline_demo.py --cases 150

      # A README is prose and drifts; audit/offline.json is evidence and does
      # not. This rebuilds each published figure from the JSON and requires the
      # exact string, so a re-run that shifts a number fails loudly rather than
      # leaving the document quietly wrong.
      - name: README numbers match the shipped results
        run: python scripts/check_readme_numbers.py
